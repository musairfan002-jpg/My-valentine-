<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine?</title>
<style>
    body {
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ffe6ea;
        font-family: Arial, sans-serif;
        overflow: hidden;
        cursor: pointer;
    }
    .box { 
        text-align: center; 
        z-index: 10; 
        width: 100%;
    }
    h1 { font-size: 2rem; margin-bottom: 40px; color: #ff4d6d; padding: 0 10px; white-space: nowrap; }
    
    /* Solid centering with a 40px gap */
    .btn-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 40px; 
        position: relative;
        height: 100px;
    }
    
    button {
        width: 120px; 
        height: 50px; 
        font-size: 1.1rem;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
    }

    #yes { 
        background: #ff4d6d; 
        color: white; 
        z-index: 20; 
    }

    #no { 
        background: #adb5bd; 
        color: white; 
        z-index: 15;
        transition: transform 0.1s ease-out;
    }
    
    .heart {
        position: fixed;
        top: -60px;
        font-size: 30px;
        animation: fall linear forwards;
        opacity: 0.5;
        z-index: 1; 
    }
    @keyframes fall {
        0% { transform: translateY(0) rotate(0deg); }
        100% { transform: translateY(110vh) rotate(360deg); }
    }

    .result-text {
        font-size: 1.8rem;
        font-weight: bold;
        color: #ff4d6d;
        white-space: nowrap; 
        margin: 10px 0;
    }
</style>
</head>
<body onclick="handleFirstInteraction()" ontouchstart="handleFirstInteraction()">

<audio id="bg-music" loop preload="auto">
    <source src="american-dawn.mp3" type="audio/mpeg">
</audio>

<audio id="yes-music" preload="auto">
    <source src="yes-audio.mp4" type="audio/mp4">
</audio>

<div class="box" id="main-content">
    <h1 id="heading">Will you be my Valentine? 🌹♥️</h1>
    <div class="btn-container">
        <button id="yes" onclick="yesClicked(event)">Yes ♥️</button>
        <button id="no" onmouseover="moveNo()" ontouchstart="moveNo(event)">No 😤🔪</button>
    </div>
</div>

<script>
    const noBtn = document.getElementById("no");
    const bgMusic = document.getElementById("bg-music");
    const yesMusic = document.getElementById("yes-music");
    let musicStarted = false;
    let noScale = 1.0;
    let heartFrequency = 200; 
    let heartTimer;

    function createHeartStorm() {
        clearInterval(heartTimer);
        heartTimer = setInterval(() => {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.innerHTML = "♥️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = Math.random() * 20 + 20 + "px";
            heart.style.animationDuration = Math.random() * 3 + 2 + "s";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }, heartFrequency);
    }
    createHeartStorm();

    function handleFirstInteraction() {
        if (!musicStarted) {
            bgMusic.currentTime = 9;
            bgMusic.volume = 1.0; 
            bgMusic.play();
            musicStarted = true;
        }
    }

    function moveNo(e) {
        if(e) e.stopPropagation(); 
        
        // Break out of the flexbox flow once interaction starts
        if (noBtn.style.position !== "fixed") {
            noBtn.style.position = "fixed";
        }

        const side = Math.random() > 0.5 ? 1 : -1;
        const x = (Math.random() * (window.innerWidth / 3) + 120) * side;
        const y = Math.random() * (window.innerHeight - 200) - (window.innerHeight / 2);
        
        noScale -= 0.08; 
        if (noScale < 0.2) noScale = 0.2;
        
        noBtn.style.left = "50%";
        noBtn.style.top = "50%";
        noBtn.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${noScale})`;
    }

    function yesClicked(e) {
        if(e) e.stopPropagation();
        handleFirstInteraction();

        bgMusic.volume = 0.05; 
        yesMusic.volume = 1.0;
        yesMusic.play();

        heartFrequency = 35; 
        createHeartStorm();

        document.getElementById("main-content").innerHTML = `
            <div class="result-text">I knew you'd say yes 😌♥️</div>
            <div class="result-text">BEST DECISION EVER 😋♥️</div>
        `;
    }
</script>
</body>
</html>
